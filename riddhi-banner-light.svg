<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Riddhi Mhadgut — Full-Stack Developer &amp; AI/ML Engineer">
<title>Riddhi Mhadgut — Full-Stack Developer &amp; AI/ML Engineer</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-2px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.pop{opacity:0;animation:popIn .6s cubic-bezier(.2,.8,.3,1.25) forwards;transform-box:fill-box;transform-origin:center}
.cur{animation:blink 1s step-end infinite}
.fl{transform-box:fill-box;transform-origin:center;animation:floaty 4.4s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.pill{opacity:0;animation:fadeIn .6s ease forwards}
]]></style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#faf5ff"/><stop offset="55%" stop-color="#fdf0f7"/><stop offset="100%" stop-color="#f5eeff"/>
</linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#d6499b;#8b5cd6;#6d8fd9;#d6499b" dur="7s" repeatCount="indefinite"/></stop>
  <stop offset="50%"><animate attributeName="stop-color" values="#e0559f;#7c5ad0;#e0559f" dur="7s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#8b5cd6;#e0559f;#8b5cd6" dur="7s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="borderg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#e0559f" stop-opacity=".5"/>
  <stop offset="50%" stop-color="#8b5cd6" stop-opacity=".4"/>
  <stop offset="100%" stop-color="#6d8fd9" stop-opacity=".5"/>
</linearGradient>
<radialGradient id="orbP"><stop offset="0%" stop-color="#e0559f" stop-opacity=".14"/><stop offset="100%" stop-color="#e0559f" stop-opacity="0"/></radialGradient>
<radialGradient id="orbL"><stop offset="0%" stop-color="#8b5cd6" stop-opacity=".14"/><stop offset="100%" stop-color="#8b5cd6" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r=".6" fill="rgba(139,92,214,.14)"/></pattern>

<clipPath id="cPrompt"><rect x="60" y="66" width="0" height="30"><animate attributeName="width" from="0" to="430" dur="1s" begin=".3s" fill="freeze"/></rect></clipPath>
<clipPath id="cHi"><rect x="60" y="104" width="0" height="42"><animate attributeName="width" from="0" to="220" dur=".5s" begin="1.2s" fill="freeze"/></rect></clipPath>

<!-- role cycling: 4 roles over 24s -->
<clipPath id="r1"><rect x="60" y="228" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;.01;.07;.2;.24;1" dur="24s" repeatCount="indefinite" begin="2.8s"/></rect></clipPath>
<clipPath id="r2"><rect x="60" y="228" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;.26;.32;.45;.49;1" dur="24s" repeatCount="indefinite" begin="2.8s"/></rect></clipPath>
<clipPath id="r3"><rect x="60" y="228" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;.51;.57;.7;.74;1" dur="24s" repeatCount="indefinite" begin="2.8s"/></rect></clipPath>
<clipPath id="r4"><rect x="60" y="228" width="0" height="34"><animate attributeName="width" values="0;0;520;520;0;0" keyTimes="0;.76;.82;.95;.99;1" dur="24s" repeatCount="indefinite" begin="2.8s"/></rect></clipPath>

<clipPath id="q1"><rect x="62" y="300" width="0" height="30"><animate attributeName="width" from="0" to="480" dur=".7s" begin="3.6s" fill="freeze"/></rect></clipPath>

<clipPath id="bannerBox"><rect x="1" y="1" width="1278" height="418" rx="22"/></clipPath>
</defs>

<!-- BACKGROUND -->
<rect width="1280" height="420" rx="22" fill="url(#bg)"/>
<rect width="1280" height="420" rx="22" fill="url(#dots)"/>
<circle cx="220" cy="120" r="230" fill="url(#orbL)"><animate attributeName="r" values="230;255;230" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="330" r="260" fill="url(#orbP)"><animate attributeName="r" values="260;285;260" dur="6.4s" repeatCount="indefinite"/></circle>
<rect x="1" y="1" width="1278" height="418" rx="22" fill="none" stroke="url(#borderg)" stroke-width="1.5"/>

<!-- sparkles -->
<g class="tw" style="animation-delay:.4s"><path d="M470 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f4c9ea"/></g>
<g class="tw" style="animation-delay:1.5s"><path d="M960 90l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#ff9dd6"/></g>
<g class="tw" style="animation-delay:2.6s"><path d="M1180 300l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#c9a4f5"/></g>

<!-- ============ LEFT: TEXT CONTENT ============ -->
<text class="mono" clip-path="url(#cPrompt)" x="60" y="87" font-size="15"><tspan fill="#2f9e5c" font-weight="bold">riddhi@fullstack-dev</tspan><tspan fill="#7a6f8c">:~$ </tspan><tspan fill="#3d2c52">cat </tspan><tspan fill="#d6499b">about.md</tspan></text>
<rect x="480" y="72" width="8" height="16" fill="#2f9e5c" opacity="0"><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="1.35s"/></rect>

<text clip-path="url(#cHi)" x="60" y="134" font-size="26" font-weight="bold" fill="#3d2c52">Hi, I'm 👋</text>

<g class="pop" style="animation-delay:1.5s" transform="translate(60,206)" filter="url(#glow)">
  <text font-size="58" font-weight="800" fill="url(#nameg)">Riddhi Mhadgut</text>
</g>

<!-- cycling role line -->
<g class="mono">
  <text clip-path="url(#r1)" x="60" y="252" font-size="24" font-weight="bold" fill="#8b5cd6">Full-Stack Developer</text>
  <text clip-path="url(#r2)" x="60" y="252" font-size="24" font-weight="bold" fill="#d6499b">AI / ML Engineer</text>
  <text clip-path="url(#r3)" x="60" y="252" font-size="24" font-weight="bold" fill="#8b5cd6">SIH'25 National Runner-Up 🏆</text>
  <text clip-path="url(#r4)" x="60" y="252" font-size="24" font-weight="bold" fill="#d6499b">Open Source @ GSSoC &amp; SWoC</text>
</g>

<text clip-path="url(#q1)" x="62" y="322" font-size="17" fill="#6b5f7d" font-style="italic">"I don't just write code — I ship it, test it, and own it."</text>

<!-- stat pills -->
<g class="pill" style="animation-delay:4.2s">
  <rect x="60" y="352" width="150" height="36" rx="18" fill="#ffffff" stroke="#8b5cd6" stroke-opacity=".5"/>
  <text x="135" y="375" text-anchor="middle" font-size="13" fill="#3d2c52" font-weight="bold">🎓 CGPA 9.07/10</text>
</g>
<g class="pill" style="animation-delay:4.4s">
  <rect x="222" y="352" width="168" height="36" rx="18" fill="#ffffff" stroke="#d6499b" stroke-opacity=".5"/>
  <text x="306" y="375" text-anchor="middle" font-size="13" fill="#3d2c52" font-weight="bold">💡 380+ LeetCode</text>
</g>
<g class="pill" style="animation-delay:4.6s">
  <rect x="402" y="352" width="176" height="36" rx="18" fill="#ffffff" stroke="#8b5cd6" stroke-opacity=".5"/>
  <text x="490" y="375" text-anchor="middle" font-size="13" fill="#3d2c52" font-weight="bold">📜 Patent Holder</text>
</g>

<!-- ============ RIGHT: FLOATING TECH PILLS ============ -->
<g class="fl" style="animation-delay:.2s">
  <rect x="880" y="70" width="132" height="42" rx="21" fill="#ffffff" stroke="#61dafb" stroke-opacity=".55"/>
  <text x="946" y="96" text-anchor="middle" font-size="14" fill="#61dafb" font-weight="bold">⚛ React.js</text>
</g>

</g>
<g class="fl" style="animation-delay:1.6s">
  <rect x="1060" y="240" width="160" height="42" rx="21" fill="#ffffff" stroke="#ff9dd6" stroke-opacity=".55"/>
  <text x="1140" y="266" text-anchor="middle" font-size="14" fill="#ff9dd6" font-weight="bold">🧠 TensorFlow</text>
</g>
<g class="fl" style="animation-delay:2.1s">
  <rect x="890" y="290" width="150" height="42" rx="21" fill="#ffffff" stroke="#5cbfec" stroke-opacity=".55"/>
  <text x="965" y="316" text-anchor="middle" font-size="14" fill="#5cbfec" font-weight="bold">👁 OpenCV</text>
